name: LlamaIndex Documentation Auto-Crawl

on:
  schedule:
    # Check for updates daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_crawl:
        description: 'Force crawl even if version unchanged'
        type: boolean
        default: false
      force_release:
        description: 'Force create release (overwrite existing)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      should-crawl: ${{ steps.compare-version.outputs.should-crawl }}
      last-version: ${{ steps.get-last-version.outputs.last-version }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Get LlamaIndex version
      id: get-version
      run: |
        # Get version from PyPI API
        VERSION=$(curl -s https://pypi.org/pypi/llama-index/json | jq -r '.info.version')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Current LlamaIndex version: $VERSION"

    - name: Get last crawled version
      id: get-last-version
      run: |
        if [ -f "LAST_VERSION" ]; then
          LAST_VERSION=$(cat LAST_VERSION)
          echo "last-version=$LAST_VERSION" >> $GITHUB_OUTPUT
          echo "Last crawled version: $LAST_VERSION"
        else
          echo "last-version=" >> $GITHUB_OUTPUT
          echo "No previous version found"
        fi

    - name: Compare versions
      id: compare-version
      run: |
        CURRENT="${{ steps.get-version.outputs.version }}"
        LAST="${{ steps.get-last-version.outputs.last-version }}"
        FORCE="${{ github.event.inputs.force_crawl }}"
        
        if [ "$FORCE" = "true" ] || [ "$CURRENT" != "$LAST" ]; then
          echo "should-crawl=true" >> $GITHUB_OUTPUT
          echo "Will crawl: version changed or forced"
        else
          echo "should-crawl=false" >> $GITHUB_OUTPUT
          echo "Skip crawl: version unchanged"
        fi

  crawl-docs:
    needs: check-version
    if: needs.check-version.outputs.should-crawl == 'true'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        crawl4ai-setup

    - name: Verify installation
      run: |
        crawl4ai-doctor

    - name: Archive previous version
      if: needs.check-version.outputs.last-version != ''
      run: |
        python -c "
        import sys
        sys.path.append('.')
        from main import archive_version
        
        last_version = '${{ needs.check-version.outputs.last-version }}'
        if last_version:
            archive_version(last_version)
        "

    - name: Run crawler
      run: |
        python main.py

    - name: Update version file
      run: |
        echo "${{ needs.check-version.outputs.version }}" > LAST_VERSION

    - name: Commit and push changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        git add .
        
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "🤖 Auto-crawl LlamaIndex docs v${{ needs.check-version.outputs.version }}"
          git push origin main
        fi

    - name: Check if tag exists
      id: check-tag
      run: |
        if git rev-parse "v${{ needs.check-version.outputs.version }}" >/dev/null 2>&1; then
          echo "tag-exists=true" >> $GITHUB_OUTPUT
          echo "Tag v${{ needs.check-version.outputs.version }} already exists"
        else
          echo "tag-exists=false" >> $GITHUB_OUTPUT
          echo "Tag v${{ needs.check-version.outputs.version }} does not exist"
        fi

    - name: Delete existing release and tag
      if: steps.check-tag.outputs.tag-exists == 'true' && github.event.inputs.force_release == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Force release enabled, deleting existing release and tag..."
        
        # Delete release if it exists
        if gh release view "v${{ needs.check-version.outputs.version }}" >/dev/null 2>&1; then
          gh release delete "v${{ needs.check-version.outputs.version }}" --yes
          echo "Deleted existing release"
        fi
        
        # Delete tag if it exists
        if git rev-parse "v${{ needs.check-version.outputs.version }}" >/dev/null 2>&1; then
          git push --delete origin "v${{ needs.check-version.outputs.version }}"
          echo "Deleted existing tag"
        fi

    - name: Create release
      if: needs.check-version.outputs.version != '' && (steps.check-tag.outputs.tag-exists == 'false' || github.event.inputs.force_release == 'true')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ needs.check-version.outputs.version }}"
        FORCE_RELEASE="${{ github.event.inputs.force_release }}"
        
        # Create release note with force info
        RELEASE_NOTES="Automated crawl of LlamaIndex documentation
        
        Version: ${VERSION}"
        
        if [ "$FORCE_RELEASE" = "true" ]; then
          RELEASE_NOTES="${RELEASE_NOTES}
        🔄 Force release - Algorithm/crawler updated"
        fi
        
        RELEASE_NOTES="${RELEASE_NOTES}
        
        Files updated:
        - \`llms.txt\` - Latest combined documentation
        - \`versions/v${VERSION}/\` - Archived version
        
        Total files processed: See commit for details"
        
        gh release create "v${VERSION}" \
          --title "LlamaIndex Docs v${VERSION}" \
          --notes "${RELEASE_NOTES}"
        
        echo "✅ Release v${VERSION} created successfully"
