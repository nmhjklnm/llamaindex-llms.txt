name: LlamaIndex Documentation Auto-Crawl

on:
  schedule:
    # Check for updates daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_crawl:
        description: 'Force crawl even if version unchanged'
        type: boolean
        default: false
      force_release:
        description: 'Force create release (overwrite existing)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      should-crawl: ${{ steps.compare-version.outputs.should-crawl }}
      last-version: ${{ steps.get-last-version.outputs.last-version }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Get LlamaIndex version
      id: get-version
      run: |
        # Get version from PyPI API
        VERSION=$(curl -s https://pypi.org/pypi/llama-index/json | jq -r '.info.version')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Current LlamaIndex version: $VERSION"

    - name: Get last crawled version
      id: get-last-version
      run: |
        if [ -f "LAST_VERSION" ]; then
          LAST_VERSION=$(cat LAST_VERSION)
          echo "last-version=$LAST_VERSION" >> $GITHUB_OUTPUT
          echo "Last crawled version: $LAST_VERSION"
        else
          echo "last-version=" >> $GITHUB_OUTPUT
          echo "No previous version found"
        fi

    - name: Compare versions
      id: compare-version
      run: |
        CURRENT="${{ steps.get-version.outputs.version }}"
        LAST="${{ steps.get-last-version.outputs.last-version }}"
        FORCE="${{ github.event.inputs.force_crawl }}"
        
        if [ "$FORCE" = "true" ] || [ "$CURRENT" != "$LAST" ]; then
          echo "should-crawl=true" >> $GITHUB_OUTPUT
          echo "Will crawl: version changed or forced"
        else
          echo "should-crawl=false" >> $GITHUB_OUTPUT
          echo "Skip crawl: version unchanged"
        fi

  crawl-docs:
    needs: check-version
    if: needs.check-version.outputs.should-crawl == 'true'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        crawl4ai-setup

    - name: Verify installation
      run: |
        crawl4ai-doctor

    - name: Archive previous version
      if: needs.check-version.outputs.last-version != ''
      run: |
        python -c "
        import sys
        sys.path.append('.')
        from main import archive_version
        
        last_version = '${{ needs.check-version.outputs.last-version }}'
        if last_version:
            archive_version(last_version)
        "

    - name: Run crawler
      run: |
        python main.py

    - name: Update version file
      run: |
        echo "${{ needs.check-version.outputs.version }}" > LAST_VERSION

    - name: Commit and push changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        git add .
        
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "🤖 Auto-crawl LlamaIndex docs v${{ needs.check-version.outputs.version }}"
          git push origin main
        fi

    - name: Check if tag and release exist
      id: check-tag
      run: |
        # 检查远程 tag 是否存在
        if git ls-remote --tags origin | grep -q "refs/tags/v${{ needs.check-version.outputs.version }}$"; then
          echo "tag-exists=true" >> $GITHUB_OUTPUT
          echo "Tag v${{ needs.check-version.outputs.version }} exists on remote"
        else
          echo "tag-exists=false" >> $GITHUB_OUTPUT
          echo "Tag v${{ needs.check-version.outputs.version }} does not exist on remote"
        fi
        # 检查 release 是否存在
        if gh release view "v${{ needs.check-version.outputs.version }}" >/dev/null 2>&1; then
          echo "release-exists=true" >> $GITHUB_OUTPUT
          echo "Release v${{ needs.check-version.outputs.version }} exists"
        else
          echo "release-exists=false" >> $GITHUB_OUTPUT
          echo "Release v${{ needs.check-version.outputs.version }} does not exist"
        fi

    - name: Delete existing release and tag
      if: (steps.check-tag.outputs.tag-exists == 'true' || steps.check-tag.outputs.release-exists == 'true') && github.event.inputs.force_release == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Force release enabled, deleting existing release and tag..."
        # 删除 release 并清理 tag
        if gh release view "v${{ needs.check-version.outputs.version }}" >/dev/null 2>&1; then
          gh release delete "v${{ needs.check-version.outputs.version }}" --yes --cleanup-tag
          echo "Deleted existing release and cleaned up tag"
        fi
        # 再次尝试删除远程 tag（防止 tag 残留）
        if git ls-remote --tags origin | grep -q "refs/tags/v${{ needs.check-version.outputs.version }}$"; then
          git push --delete origin "v${{ needs.check-version.outputs.version }}" || echo "Tag already deleted or doesn't exist"
          echo "Attempted to delete remote tag"
        fi
        sleep 5

    - name: Create release
      if: needs.check-version.outputs.version != '' && (github.event.inputs.force_release == 'true' || (steps.check-tag.outputs.tag-exists == 'false' && steps.check-tag.outputs.release-exists == 'false'))
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ needs.check-version.outputs.version }}"
        FORCE_RELEASE="${{ github.event.inputs.force_release }}"
        # Create release note with force info
        RELEASE_NOTES="Automated crawl of LlamaIndex documentation\n\nVersion: ${VERSION}"
        if [ "$FORCE_RELEASE" = "true" ]; then
          RELEASE_NOTES="${RELEASE_NOTES}\n🔄 Force release - Algorithm/crawler updated"
        fi
        RELEASE_NOTES="${RELEASE_NOTES}\n\nFiles updated:\n- \`llms.txt\` - Latest combined documentation\n- \`versions/v${VERSION}/\` - Archived version\n\nTotal files processed: See commit for details"
        if ! gh release create "v${VERSION}" \
          --title "LlamaIndex Docs v${VERSION}" \
          --notes "${RELEASE_NOTES}"; then
          echo "❌ Failed to create release. Checking if it already exists..."
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists. Use force_release=true to overwrite."
            exit 1
          else
            echo "Unknown error occurred while creating release."
            exit 1
          fi
        fi
        echo "✅ Release v${VERSION} created successfully"
